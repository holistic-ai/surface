version: 2

# Two ecosystems, both grouped into a single weekly pull request. Ungrouped, a
# 161-package lockfile and eight actions produce enough noise that the updates
# stop getting read, which defeats the point.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor together: the MSRV job is the thing most likely to catch
      # a problem here, and it does not care which of them moved.
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
